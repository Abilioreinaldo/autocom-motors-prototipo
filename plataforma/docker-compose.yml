name: autocom

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: autocom/plataforma:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
    - public:/var/www/html/public
    - ./.env:/var/www/html/.env:ro
  depends_on:
    mysql:
      condition: service_healthy
  networks: [autocom]

services:
  app:
    <<: *app
    container_name: autocom-app
    environment:
      AUTOCOM_ROLE: app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: autocom-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro
    depends_on: [app]
    networks: [autocom]

  queue:
    <<: *app
    container_name: autocom-queue
    environment:
      AUTOCOM_ROLE: queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=600
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  scheduler:
    <<: *app
    container_name: autocom-scheduler
    environment:
      AUTOCOM_ROLE: scheduler
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: autocom-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-autocom}
      MYSQL_USER: ${DB_USERNAME:-autocom}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      TZ: America/Sao_Paulo
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/autocom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [autocom]

volumes:
  mysql:
  storage:
  public:

networks:
  autocom:
